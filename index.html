<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no kills pinch-zoom and the auto-
         zoom iOS does when focusing an input. Capacitor wrapper apps
         shouldn't behave like a website you pinch into. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0510" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="auê" />
    <!-- Safari's native Smart App Banner — shows an "Abrir"/"Obter" bar
         at the top of the page on iOS, no custom JS needed. This only
         works once there's a real App Store id, which is why the DIY
         InstallBanner.jsx component existed before auê went public;
         that component is gone now that this covers the same case
         natively (and better — Apple's own UI, not blockable). -->
    <meta name="apple-itunes-app" content="app-id=6765535013" />
    <meta name="description" content="auê — Curitiba que acontece. Todos os eventos da cidade num lugar só, com a galera junto." />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <title>auê — Curitiba que acontece</title>

    <!-- Link preview (Open Graph + Twitter). Until these existed a
         shared auê link unfurled as a bare URL, which is why sharing
         the App Store link looked like the better option — and that one
         is worse, because Apple forces the slug "au%C3%AA" into the URL
         and shows that unreadable string in the card.

         URLs here are absolute and hard-coded to the canonical origin
         on purpose. og:url is meant to name the canonical page whatever
         host served the request, and unfurlers won't resolve a relative
         og:image at all. Staging therefore advertises production's
         card, which is correct: nobody should be sharing a staging
         link, and if they do it shouldn't unfurl as a second product.

         The card itself is public/og-image.svg, rendered to PNG by
         scripts/render-icons.js — unfurlers don't render SVG. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="auê" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="auê — Curitiba que acontece" />
    <meta property="og:description" content="Todos os eventos da cidade num lugar só. Shows, exposições, feiras, oficinas — atualizado todo dia." />
    <meta property="og:url" content="https://auecuritiba.com/" />
    <meta property="og:image" content="https://auecuritiba.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="auê — Curitiba que acontece" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="auê — Curitiba que acontece" />
    <meta name="twitter:description" content="Todos os eventos da cidade num lugar só. Shows, exposições, feiras, oficinas — atualizado todo dia." />
    <meta name="twitter:image" content="https://auecuritiba.com/og-image.png" />
    <link rel="canonical" href="https://auecuritiba.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
