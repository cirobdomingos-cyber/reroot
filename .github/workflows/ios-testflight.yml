name: iOS — TestFlight

# Builds the Capacitor iOS app and uploads it to TestFlight.
# Triggers on `ios-v*` tags (so `git tag ios-v0.1 && git push --tags` ships a build)
# or via the GitHub UI's "Run workflow" button.
#
# Required GitHub secrets:
#   APPLE_P12_BASE64      — base64-encoded Apple Distribution .p12 (cert + private key)
#   APPLE_P12_PASSWORD    — password used when exporting the .p12
#   APPLE_PROFILE_BASE64  — base64-encoded "aue App Store" provisioning profile
#   ASC_KEY_ID            — App Store Connect API key ID (10 chars)
#   ASC_ISSUER_ID         — App Store Connect issuer UUID
#   ASC_KEY_P8            — full content of the .p8 file (used for upload, not signing)
#
# Why manual signing instead of -allowProvisioningUpdates: auto-provisioning
# wouldn't yield a working profile across multiple debug rounds even with an
# Admin API key + a registered device. Manual cert + profile management is
# slower to set up but rock-solid forever after.

on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: GR8L4N89V2
      XCODE_PROJECT: ios/App/App.xcodeproj
      XCODE_SCHEME: App
      PROFILE_NAME: "aue App Store"

    steps:
      - uses: actions/checkout@v4

      # macos-15 default Xcode is 16.x — required by Capacitor 8 for Swift
      # plugin compilation. Letting GHA's default apply rather than pinning,
      # since runner image updates also bump default Xcode predictably.
      - name: Show Xcode version
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app (Vite)
        run: npm run build

      - name: Capacitor sync (copies dist/ into iOS bundle)
        run: npx cap sync ios

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      # Monotonic build number per CI run — TestFlight rejects duplicates.
      - name: Set CFBundleVersion to run number
        working-directory: ios/App
        run: xcrun agvtool new-version -all "${{ github.run_number }}"

      # Install Apple Distribution certificate into a fresh, ephemeral keychain.
      # Using a temp keychain isolates this run from the runner's default state
      # and avoids leaving credentials behind.
      - name: Install Apple Distribution certificate
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_P12_BASE64" | base64 -d > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -P "$APPLE_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Add to the user keychain search list so codesign can find the cert.
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Allow codesign to use the key without a UI password prompt.
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$APPLE_PROFILE_BASE64" | base64 -d > "$PROFILES_DIR/aue.mobileprovision"

      # ASC API key still needed for the upload step (xcrun altool authenticates
      # to App Store Connect via the same key).
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive (manual signing)
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/aue.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.aue</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/aue.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "Key file: $KEY_PATH"
          echo "Key file size: $(wc -c < "$KEY_PATH") bytes (expected ~250)"
          echo "Key first line: $(head -1 "$KEY_PATH")"
          echo "Key last line: $(tail -1 "$KEY_PATH")"
          echo "Issuer ID prefix: $(echo "${{ secrets.ASC_ISSUER_ID }}" | cut -c1-8)..."
          echo ""
          echo "Probing auth with --list-providers (no upload)..."
          xcrun altool --list-providers \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            --output-format json || \
            echo "AUTH PROBE FAILED — check ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 secrets"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }}
