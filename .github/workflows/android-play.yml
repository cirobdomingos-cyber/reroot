name: Android — Google Play

# Builds the Capacitor Android app as a signed AAB and uploads it to Google Play.
# Triggers on `android-v*` tags (so `git tag android-v1.2 && git push --tags`
# ships a build to the internal track) or via the GitHub UI's "Run workflow"
# button, which lets you pick the track.
#
# Required GitHub secrets:
#   ANDROID_KEYSTORE_BASE64     — base64-encoded upload keystore (.jks, alias aue-upload)
#   ANDROID_KEYSTORE_PASSWORD   — keystore password
#   ANDROID_KEY_ALIAS           — key alias inside the keystore (aue-upload)
#   ANDROID_KEY_PASSWORD        — key password (same as the keystore's for PKCS12)
#   PLAY_SERVICE_ACCOUNT_JSON   — full JSON key of the Google Cloud service account
#                                 granted access in Play Console > Users and permissions
# Optional:
#   GOOGLE_SERVICES_JSON_BASE64 — base64 google-services.json (Firebase / FCM push);
#                                 without it the google-services plugin is skipped
#
# The FIRST AAB must be uploaded by hand in Play Console: until the app has one
# build, the Publishing API answers "package not found". Setup in
# docs/ANDROID_RELEASE.md.

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE_NAME: app.aue
      # Tag pushes have no inputs; they ship to the internal track.
      TRACK: ${{ inputs.track || 'internal' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # No icon render step: scripts/render-icons.js writes only the PWA PNGs
      # in public/ and the iOS asset catalog. Android launcher icons are the
      # committed mipmaps under android/app/src/main/res/.

      # Capacitor serves web assets from https://localhost on Android
      # (androidScheme), so the default same-origin BASE_URL='' breaks every
      # backend fetch. Bake the production URL at build time, as on iOS.
      - name: Build web app (Vite)
        env:
          VITE_API_URL: https://auecuritiba.com
          VITE_PUBLIC_ORIGIN: https://auecuritiba.com
          VITE_APPLE_WEB_SERVICE_ID: app.aue.web
          VITE_APPLE_WEB_REDIRECT_URI: https://auecuritiba.com/
        run: npm run build

      - name: Capacitor sync (copies dist/ into the Android project)
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Monotonic versionCode: run_number*10 + run_attempt, so re-runs of the
      # same run still go up. It must stay above 2, the last hand-set code.
      # versionName comes from the tag (android-v1.2 -> 1.2).
      - name: Compute version
        id: version
        run: |
          CODE=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/android-v}"
          else
            NAME="1.1.${{ github.run_number }}"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE versionName=$NAME track=$TRACK"

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; building without Firebase"
          fi

      - name: Build signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: aue-android-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.TRACK }}
          # minifyEnabled is on, so send the R8 mapping for readable crash traces.
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          # `draft` is required while the app is unpublished (never released
          # to production): Play rejects `completed` for a draft app. Once the
          # listing is live, switch to `completed` so builds roll out on upload.
          status: draft

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json
