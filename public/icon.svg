<?xml version="1.0" encoding="UTF-8"?>
<!--
  auê — app icon (1024×1024 viewBox).

  Coral background, cream wordmark "aue" (NO native diacritic — the small
  font-rendered ^ on the ê was visually competing with the brand mark).
  The big drawn circumflex above the 'e' IS the brand mark — reads as a
  "smile" / cheer gesture (auê = a lively gathering / cheer in BR-PT).

  Wordmark drawn as <text> using Manrope/system fallback chain. PNGs
  rendered via scripts/render-icons.js.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Rounded-square background (Android-adaptive icon safe zone). -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="#E8623F"/>

  <!--
    Wordmark "aue" without the native diacritic on the e — the prominent
    drawn circumflex below stands in for it. Single ^ on the icon now.
  -->
  <text
    x="512" y="640"
    font-family="Manrope, Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="800"
    font-size="440"
    fill="#FCF5EB"
    text-anchor="middle"
    letter-spacing="-12">aue</text>

  <!--
    Brand circumflex — sits over the 'e'. Bold stroke, lightly oversized
    so it reads as the prominent design element, not as a typographic mark.
  -->
  <path
    d="M 700 290 L 790 200 L 880 290"
    fill="none"
    stroke="#FCF5EB"
    stroke-width="64"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Honey accent dot — small "spark" near the circumflex.
       Reads as confetti / "tem auê acontecendo". -->
  <circle cx="170" cy="190" r="32" fill="#F4A623"/>
</svg>
